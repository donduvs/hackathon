services:
  - type: web
    name: camerton
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log --proxy-headers --forwarded-allow-ips "*"
    envVars:
      - key: IMD_SECRET
        generateValue: true
